/* ====== 종합 규칙 엔진 ====== */
function catOf(d){ if(!d)return 'hold'; if(d.includes('미게재')||d.includes('기각'))return 'noise'; if(d.includes('조건부'))return 'conditional'; if(d.includes('보류'))return 'hold'; return 'support'; }
function confOf(p){ const d=p.b.dec||''; if(d.includes('신사업'))return '높음'; if(catOf(d)==='noise')return '높음'; return '중간'; }
function synthesize(persp){
  const items=persp.map(p=>({axis:p.axis,cat:catOf(p.b.dec),conf:confOf(p),judg:p.b.judgment}));
  const sup=items.filter(i=>i.cat==='support'),cond=items.filter(i=>i.cat==='conditional'),noise=items.filter(i=>i.cat==='noise');
  const conflict=sup.length>0&&noise.length>0; let final,vc;
  if(sup.length){final='게재';vc='a';} else if(cond.length){final='조건부 게재';vc='h';} else if(noise.length){final='미게재';vc='r';} else {final='보류';vc='h';}
  let prio; if(final==='미게재'||final==='보류')prio='우선순위 낮음'; else if(sup.length>=2)prio='우선순위 높음'; else if(sup.some(i=>i.conf==='높음'))prio='우선순위 높음'; else prio='우선순위 중';
  const win=sup.length?sup:(cond.length?cond:(noise.length?noise:items)); const top=win.slice().sort((a,b)=>(b.conf==='높음')-(a.conf==='높음'))[0];
  let comment,trace;
  if(conflict){comment=`관점 충돌 — ${sup.map(i=>i.axis).join('·')}은 게재, ${noise.map(i=>i.axis).join('·')}은 노이즈. 놓침 비용 고려해 게재하되 이견 병기.`;trace=`지지 ${sup.length} vs 노이즈 ${noise.length} → 충돌`;}
  else if(sup.length>=2){comment=`${sup.map(i=>i.axis).join('·')} 관점 수렴 — 확신도 상향.`;trace=`지지 ${sup.length}개 수렴 → 높음`;}
  else if(final==='조건부 게재'){comment=`현재는 노이즈이나 경계조건 충족 시 게재로 전환.`;trace=`조건부만 → 조건부 게재`;}
  else if(final==='미게재'){comment=`모든 관점이 노이즈 → 리포트 제외.`;trace=`지지 0 → 미게재`;}
  else{comment=`${top?top.axis:''} 단일 관점 유효.`;trace=`단일 지지 → 게재`;}
  let report=''; if(final!=='미게재'){report=top?top.judg:''; if(conflict&&noise.length)report+=` (이견: ${noise[0].axis} — 노이즈)`;}
  return {final,vc,prio,comment,trace,report,conflict};
}

function verdictHTML(v){

function keyOf(d){return 'a_'+encodeURIComponent(d.title).replace(/%/g,'').slice(0,40);}

  return `<div class="capture" data-key="${k}" data-title="${esc(d.title)}"><span class="clab">큐레이션 — 팀 확정(채택/기각) → ⑤ KB로 축적</span>

    <div><button class="csave">저장</button><span class="csaved" ${s?'':'hidden'}>✓ 저장됨</span></div></div>`;

function renderReport(){

  const pool=ARTICLES.map(d=>({d,v:synthesize(d.persp),dec:getDec(keyOf(d))})).filter(x=>!x.v.final.includes('미게재'));
  const adopted=pool.filter(x=>x.dec&&x.dec.verdict==='채택');
  const rej=ARTICLES.length-pool.length;
  document.getElementById('summary').innerHTML=`
    <div class="kpi"><div class="n">${ARTICLES.length}</div><div class="l">이번 회차 접수</div></div>
    <div class="kpi"><div class="n">${pool.length}</div><div class="l">게재 후보(판단)</div></div>
    <div class="kpi hi"><div class="n">${adopted.length}</div><div class="l">채택(최종 반영)</div></div>
    <div class="kpi"><div class="n">${rej}</div><div class="l">미게재(기각)</div></div>`;
  const finalList = adopted.length?adopted:pool; // 채택이 없으면 후보를 초안에 노출
  const cards = finalList.map(({d,v,dec})=>`
    <div class="section"><div class="art nb"><div class="k">${badge(d)} <span class="cattag">${d.category}</span> ${srcHTML(d)}
      <span class="verd ${v.vc}" style="font-size:11px">${v.final}</span><span class="prio ${v.prio.includes('낮음')?'low':''}">${v.prio}</span>${dec?` <span class="dec ${dec.verdict==='채택'?'a':dec.verdict==='기각'?'r':'h'}">${dec.verdict}</span>`:''}</div>
      <h2>${d.title}</h2>
      <div class="v-report" style="margin:6px 0"><span class="lab">리포트 반영 문장</span>${v.report||'—'}</div>
      <div style="font-size:12px;color:var(--muted)">관점: ${d.persp.map(p=>p.axis).join(' · ')} · 근거 종합: ${v.comment}</div>
      <div style="margin-top:6px">${captureHTML(d)}</div></div></div>`).join('');
  document.getElementById('reportCards').innerHTML =
    `<div class="note">데일리에서 <b>채택</b>한 신호가 여기 모여 <b>월말 보고서 초안</b>이 됩니다. 아래 목록의 '채택'을 눌러 최종 반영을 확정하세요. (채택이 없으면 판단 에이전트의 게재 후보를 초안으로 노출)</div>`
    + (finalList.length?cards:'<div class="section"><div class="empty" style="padding:18px">게재 후보가 없습니다.</div></div>');
  renderMacro();
}

/* ====== 거시 자료 / 큐레이션 저장 ====== */
const MK='ms_macro';
function macro(){try{return JSON.parse(localStorage.getItem(MK)||'[]');}catch(e){return [];}}
function saveMacro(a){try{localStorage.setItem(MK,JSON.stringify(a));}catch(e){}}
function renderMacro(){const a=macro(),host=document.getElementById('macroList');
  host.innerHTML=a.length?a.map((m,i)=>`<div class="macro-item"><span class="mx" data-i="${i}">삭제</span><div class="mt"><span class="mtag">${m.axis}</span>${esc(m.title)}</div><div class="mm">${esc(m.body)}${m.src?' · '+esc(m.src):''}</div></div>`).join(''):'<div class="empty">아직 없음 — 위에서 거시 자료를 추가하세요.</div>';}
const LS='ms_kb_decisions';
function allDec(){try{return JSON.parse(localStorage.getItem(LS)||'{}');}catch(e){return {};}}
function getDec(k){return allDec()[k];}
function setDec(k,o){try{const a=allDec();a[k]=o;localStorage.setItem(LS,JSON.stringify(a));}catch(e){}}

/* ====== 수집 캘린더 ====== */
const CAL={1:[["CES","tech"],["IMF 세계경제전망","econ"],["前年 사건사고 통계","soc"]],2:[["국내외 보안시장 전망","ind",1],["MWC (~3월)","tech"],["경제전망(분기)","econ"],["정보보호 실태조사(~3월)","law"]],3:[["브랜드파워 K-BPI","comp"],["MWC","tech"],["ISC WEST (~4월)","ind"]],4:[["ISC WEST","ind"],["IMF 세계경제전망","econ"]],5:[["국가고객만족도 NCSI","comp"],["경제전망(분기)","econ"],["경제·산업전망(반기)","econ"]],6:[["국가정보보호백서","law"]],7:[["서비스품질 KS-SQI","comp"],["인구주택총조사","soc"],["IMF 세계경제전망","econ"]],8:[["경제전망(분기)","econ"],["경찰청 범죄통계(8월경)","soc"]],9:[["정보보호산업 실태조사","ind",1],["IFA","tech"],["고객만족도 KCSI","comp"]],10:[["트렌드 코리아","soc"],["IMF 세계경제전망","econ"]],11:[["경제전망(분기)","econ"],["경제·산업전망(반기)","econ"],["교통사고 통계","soc"],["무인경비 M/S","comp"]],12:[["(11월말 분기 경제전망 이월 확인)","econ"]]};
const CATNAME={tech:"기술",econ:"경제",ind:"업계",comp:"경쟁사",soc:"사회",law:"법령"};
const CATLBL={all:"전체",ind:"업계",comp:"경쟁사",tech:"기술",soc:"사회",law:"법령",econ:"경제/지표"};
let calFilt='all';
function renderCalendar(){
  document.getElementById('calendarView').innerHTML=`
    <div class="summary">
      <div class="kpi"><div class="n">67</div><div class="l">소스 마스터</div></div>
      <div class="kpi"><div class="n">8</div><div class="l">자동화 1순위</div></div>
      <div class="kpi"><div class="n">24</div><div class="l">정기 발간물</div></div>
      <div class="kpi"><div class="n">4</div><div class="l">기술전시회</div></div>
    </div>
    <div class="sec-title">🔄 상시 수집 (매일·연중) <span class="hint">경로 A + 자동 API/RSS</span></div>
    <div class="section"><div class="always">
      <div class="abox"><div class="at">매일</div><div class="al">키워드 웹검색 + <b>빅카인즈</b> · RSS(정책브리핑·보안뉴스) · 입법예고 · 네이버 데이터랩</div></div>
      <div class="abox"><div class="at">매월 초</div><div class="al">KDI 경제동향 · SPRi AI브리프 · 이슈리포트</div></div>
      <div class="abox"><div class="at">매월 하순</div><div class="al"><span class="star">★</span> 한국은행 BSI·ESI (필수)</div></div>
    </div></div>
    <div class="sec-title">📅 월별 정기 수집 (경로 B) <span class="hint" id="mcount"></span></div>
    <div class="calfilt" id="calfilt"></div>
    <div class="section" style="padding:14px 16px"><div class="months" id="months"></div>
      <div class="callegend"><span><span class="dot c-ind"></span>업계</span><span><span class="dot c-comp"></span>경쟁사</span><span><span class="dot c-tech"></span>기술</span><span><span class="dot c-soc"></span>사회</span><span><span class="dot c-law"></span>법령</span><span><span class="dot c-econ"></span>경제/지표</span><span style="margin-left:auto"><span class="star">★</span> = 1차 구현 대상</span></div>
    </div>`;
  const nowM=(new Date()).getMonth()+1;
  document.getElementById('calfilt').innerHTML=Object.keys(CATLBL).map(c=>`<span class="chip ${c===calFilt?'on':''}" data-c="${c}">${CATLBL[c]}</span>`).join('');
  let total=0;
  document.getElementById('months').innerHTML=Object.keys(CAL).map(m=>{
    let items=CAL[m]; if(calFilt!=='all') items=items.filter(i=>i[1]===calFilt); total+=items.length;
    const now=(+m===nowM);
    const body=items.length?items.map(i=>`<div class="citem"><span class="ccat c-${i[1]}">${CATNAME[i[1]]}</span><span>${i[2]?'<span class="star">★</span> ':''}${i[0]}</span></div>`).join(''):'<div class="citem" style="color:#aeb6c2">—</div>';
    return `<div class="mcard ${now?'now':''}"><div class="mh"><b>${m}월</b>${now?'<span class="now-b">이번 달</span>':`<span class="cc">${items.length}건</span>`}</div><div class="m-items">${body}</div></div>`;
  }).join('');
  document.getElementById('mcount').textContent=(calFilt==='all'?'연 정기 항목':CATLBL[calFilt])+' '+total+'건';
  document.getElementById('calfilt').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;calFilt=c.dataset.c;renderCalendar();});
}

/* ====== 라우터 ====== */
const VIEWS=['home','topic','daily','report','calendar','status'];
function show(id){VIEWS.forEach(v=>{const el=document.getElementById(v+'View');if(el)el.hidden=(v!==id);});}
function setView(view,cat){
  document.querySelectorAll('.nvitem').forEach(n=>n.classList.toggle('on', n.dataset.view===view && (n.dataset.cat||null)===(cat||null)));
  show(view);
  document.getElementById('groupbar').hidden = (view!=='daily');
  const dailyTitle = cat?`데일리 · ${cat}`:'데일리 (팀원) · 전체 신호';
  const meta={
    daily:[dailyTitle,'내 그룹을 고르고, 이번 회차 신호를 본다 — 채택/기각으로 월간 리포트에 쌓인다'],
    report:['월간 리포트','데일리에서 채택된 신호를 모아 월말 보고서 + 거시 자료 정리'],
    calendar:['수집 캘린더','무엇을 언제 수집하나 — 상시 + 월별 정기'],
    status:['수집 현황','소스 마스터·수집 경로·회차 접수 현황']};
  const m=meta[view]||['',''];
  document.getElementById('viewTitle').textContent=m[0];
  document.getElementById('viewSub').textContent=m[1];
  if(view==='daily'){let g='전체';try{g=localStorage.getItem('ms_group')||'전체';}catch(e){}document.querySelectorAll('#groupbar .chip').forEach(c=>c.classList.toggle('on',c.dataset.g===g));renderDaily(g,cat||null);}
  else if(view==='report')renderReport();
  else if(view==='calendar')renderCalendar();
  else if(view==='status')renderStatus();
}
/* 데일리 채택/기각 캡처 */
document.getElementById('dailyView').addEventListener('click',e=>{
  const cap=e.target.closest('.capture'); if(!cap)return;
  const vb=e.target.closest('.cbtn');
  if(vb){cap.querySelectorAll('.cbtn').forEach(x=>x.classList.remove('sel'));vb.classList.add('sel');return;}
  if(e.target.closest('.csave')){const sel=cap.querySelector('.cbtn.sel');
    setDec(cap.dataset.key,{title:cap.dataset.title,verdict:sel?sel.dataset.v:'보류',reason:cap.querySelector('.creason').value.trim(),ts:Date.now()});
    let g='전체';try{g=localStorage.getItem('ms_group')||'전체';}catch(e){} renderDaily(g,curCat);}
});

/* 네비 렌더 + 카운트 */
function navCount(view,cat){ if(view==='daily')return cat?ARTICLES.filter(d=>d.category===cat).length:ARTICLES.length; if(view==='report')return ARTICLES.map(d=>synthesize(d.persp)).filter(v=>!v.final.includes('미게재')).length; return null; }
document.getElementById('nav').innerHTML=NAV.map(([g,items])=>(g?`<div class="grp">${g}</div>`:'')+items.map(([name,view,cat])=>{
  const c=navCount(view,cat); return `<div class="nvitem" data-view="${view}" ${cat?`data-cat="${cat}"`:''}><span>${name}</span>${c!=null?`<span class="cnt">${c}</span>`:''}</div>`;
}).join('')).join('');

document.getElementById('nav').addEventListener('click',e=>{const n=e.target.closest('.nvitem');if(!n)return;setView(n.dataset.view,n.dataset.cat||null);});
document.getElementById('groupbar').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;document.querySelectorAll('#groupbar .chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');try{localStorage.setItem('ms_group',b.dataset.g);}catch(e){}renderDaily(b.dataset.g);});
document.getElementById('reportView').addEventListener('click',e=>{
  const cap=e.target.closest('.capture');
  if(cap){const vb=e.target.closest('.cbtn');if(vb){cap.querySelectorAll('.cbtn').forEach(x=>x.classList.remove('sel'));vb.classList.add('sel');return;}
    if(e.target.closest('.csave')){const sel=cap.querySelector('.cbtn.sel');setDec(cap.dataset.key,{title:cap.dataset.title,verdict:sel?sel.dataset.v:'보류',reason:cap.querySelector('.creason').value.trim(),ts:Date.now()});cap.querySelector('.csaved').hidden=false;}return;}
  const mx=e.target.closest('.mx');if(mx){const a=macro();a.splice(+mx.dataset.i,1);saveMacro(a);renderMacro();}
});
document.getElementById('m-add').addEventListener('click',()=>{const title=document.getElementById('m-title').value.trim();if(!title){alert('제목을 입력하세요.');return;}
  const a=macro();a.push({title,axis:document.getElementById('m-axis').value,body:document.getElementById('m-body').value.trim(),src:document.getElementById('m-src').value.trim(),ts:Date.now()});
  saveMacro(a);['m-title','m-body','m-src'].forEach(id=>document.getElementById(id).value='');renderMacro();});

setView('daily',null);
</script>
